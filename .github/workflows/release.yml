name: release

# Publishes a release when a tag v<version> is pushed (the version of Cargo.toml):
# - a GitHub release with the binaries (linux x86_64, arm64, armv7, windows x86_64) and their checksums,
# - the docker image ghcr.io/<owner>/<repo>:<version> and :latest (linux/amd64, linux/arm64, linux/arm/v7).
# A pull request that changes this workflow or Dockerfile.release builds everything but publishes nothing.

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'Dockerfile.release'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_ZIGBUILD_VERSION: '0.23.4'
  ZIG_VERSION: '0.17.0'

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Version of Cargo.toml
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::the tag $GITHUB_REF_NAME does not match the version $version of Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux:
    name: linux ${{ matrix.arch }}
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
          - arch: arm64
            target: aarch64-unknown-linux-musl
          - arch: armv7
            target: armv7-unknown-linux-musleabihf
    env:
      MINISTREAM_VERSION: v${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # static binaries (musl), cross compiled with zig (C compiler and linker of the C code of ring and mimalloc)
      - name: Install cargo-zigbuild
        run: |
          python3 -m venv "$RUNNER_TEMP/zigbuild"
          "$RUNNER_TEMP/zigbuild/bin/pip" install --quiet "cargo-zigbuild==$CARGO_ZIGBUILD_VERSION" "ziglang==$ZIG_VERSION"
          echo "$RUNNER_TEMP/zigbuild/bin" >> "$GITHUB_PATH"
      - name: Build
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          name="ministream-rs_${{ needs.version.outputs.version }}_linux_${{ matrix.arch }}"
          bin="target/${{ matrix.target }}/release"
          mkdir -p "dist/$name" "image/${{ matrix.arch }}"
          cp "$bin/ministream" "$bin/generatepasswords" LICENSE README.md MIGRATION.md "dist/$name/"
          cp -r config-templates "dist/$name/"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          cp "$bin/ministream" "$bin/generatepasswords" "image/${{ matrix.arch }}/"
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            image/
          if-no-files-found: error

  windows:
    name: windows amd64
    needs: version
    runs-on: windows-latest
    env:
      MINISTREAM_VERSION: v${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          $name = "ministream-rs_${{ needs.version.outputs.version }}_windows_amd64"
          New-Item -ItemType Directory -Force "dist/$name" | Out-Null
          Copy-Item target/release/ministream.exe, target/release/generatepasswords.exe, LICENSE, README.md, MIGRATION.md "dist/$name/"
          Copy-Item -Recurse config-templates "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: windows-amd64
          path: dist/*.zip
          if-no-files-found: error

  docker:
    name: docker image
    needs: [version, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      # the binaries of the linux job, in image/<arch>/
      - uses: actions/download-artifact@v8
        with:
          pattern: linux-*
          merge-multiple: true
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          # <version>, and latest for a version which is not a pre-release
          tags: type=semver,pattern={{version}}
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: GitHub release
    needs: [version, linux, windows, docker]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # only the archives of the linux and windows jobs: the run also holds the build record
      # (<repo>~<id>.dockerbuild) uploaded by docker/build-push-action, which is not needed here
      - uses: actions/download-artifact@v8
        with:
          pattern: linux-*
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: windows-*
          path: artifacts
          merge-multiple: true
      - name: Archives and checksums
        run: |
          mkdir release
          find artifacts -name '*.tar.gz' -exec cp {} release/ \;
          find artifacts -name '*.zip' -exec cp {} release/ \;
          cd release
          sha256sum -- * > "ministream-rs_${{ needs.version.outputs.version }}_checksums.txt"
          cat ./*_checksums.txt
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        # a release published from the GitHub UI already exists (it pushed the tag): attach the files to it
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* \
              --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
